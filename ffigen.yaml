# Run with `dart run ffigen --config ffigen.yaml`.
name: ChromaprintBindings
description: |
  Bindings for the chromaprint C library.

  Regenerate bindings with `dart run ffigen --config ffigen.yaml`.
output: 'lib/chromaprint_bindings_generated.dart'
headers:
  entry-points:
    - '/usr/include/chromaprint.h'
  include-directives:
    - 'chromaprint.h'
comments:
  style: any
  length: full
