name: chromaprint
description: "Dart FFI bindings for the Chromaprint audio fingerprinting library (AcoustID)."
version: 0.2.1
repository: https://github.com/solearchitect/chromaprint

environment:
  sdk: ^3.11.4
  flutter: ">=3.3.0"

dependencies:
  ffi: ^2.1.3
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  ffigen: ^20.1.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      linux:
        ffiPlugin: true
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      macos:
        ffiPlugin: true
