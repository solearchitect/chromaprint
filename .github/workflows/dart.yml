name: Dart

on:
  push:
    branches: ["main"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: "stable"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Build native chromaprint library
        run: |
          mkdir -p build
          cd build
          cmake ../src -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j$(nproc)

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project source
        run: flutter analyze

      - name: Run tests
        run: flutter test
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write # Required for OIDC authentication to pub.dev

    steps:
      # Checkout WITHOUT submodules — the git submodule source is not
      # needed for publishing and its .gitignore triggers pub validation
      # warnings (checked-in Makefiles that are gitignored).
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: "stable"

      # Obtain a GitHub OIDC token and configure it for pub.dev.
      # This is needed because flutter pub publish doesn't integrate
      # with dart-lang/setup-dart's OIDC flow.
      # See: https://github.com/dart-lang/setup-dart/issues/68
      - name: Get OIDC token for pub.dev
        uses: actions/github-script@v7
        with:
          script: |
            let pub_token = await core.getIDToken('https://pub.dev');
            core.exportVariable('PUB_TOKEN', pub_token);

      - name: Authenticate with pub.dev
        run: flutter pub token add https://pub.dev --env-var PUB_TOKEN

      - name: Install dependencies
        run: flutter pub get

      - name: Publish to pub.dev
        run: flutter pub publish --force
