name: Dart

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Allow manual trigger for publishing.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: "stable"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Build native chromaprint library
        run: |
          mkdir -p build
          cd build
          cmake ../src -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j$(nproc)

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project source
        run: flutter analyze

      - name: Run tests
        run: flutter test
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write # Required for authentication using OIDC

    steps:
      # Checkout WITHOUT submodules — the git submodule source is not
      # needed for publishing and its .gitignore triggers pub validation
      # warnings (checked-in Makefiles that are gitignored).
      - uses: actions/checkout@v4

      # Remove the gitlinked submodule entry from the index so that
      # dart pub publish doesn't see checked-in files that are gitignored.
      - name: Remove submodule reference from git index
        run: git rm --cached chromaprint

      - uses: dart-lang/setup-dart@9a04e6d73cca37bd455e0608d7e5092f881fd603

      - name: Install dependencies
        run: flutter pub get

      - name: Publish to pub.dev
        run: flutter pub publish --force
